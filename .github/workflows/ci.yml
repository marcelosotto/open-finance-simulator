name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portoes:
    name: Portões de qualidade
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      SPECS_TOKEN: ${{ secrets.SPECS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Simulador.slnx

      - name: Formatação
        run: dotnet format Simulador.slnx --verify-no-changes --no-restore

      - name: Build e análise estática
        run: dotnet build Simulador.slnx --no-restore -warnaserror

      - name: Baixar as specs travadas
        run: dotnet run --project tools/Simulador.Ferramentas --no-build -- specs baixar

      - name: Conferir os SHA-256 das specs
        run: dotnet run --project tools/Simulador.Ferramentas --no-build -- specs verificar

      - name: Diferenças das specs (PR que troca o commit)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:specs.lock.json" > "$RUNNER_TEMP/base.lock.json" || exit 0
          if ! cmp -s "$RUNNER_TEMP/base.lock.json" specs.lock.json; then
            dotnet run --project tools/Simulador.Ferramentas --no-build -- specs diferencas \
              --base "$RUNNER_TEMP/base.lock.json" --novo specs.lock.json --resumo "$GITHUB_STEP_SUMMARY"
          fi

      - name: Testes (unidade, integração, contrato, tabela oficial e Gherkin)
        run: dotnet test Simulador.slnx --no-build --collect:"XPlat Code Coverage"

      - name: Cobertura (100% no domínio, 80% no total)
        run: dotnet run --project tools/Simulador.Ferramentas --no-build -- cobertura conferir --relatorios "tests/**/coverage.cobertura.xml"

      - name: Imagem
        run: docker build .

  front:
    name: Front-end (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Restaurar
        run: npm ci

      - name: Lint e formatação
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes (100% no core, 80% no total)
        run: npm run test:cov

      - name: Build de produção
        run: npm run build

  painel:
    name: Painel no navegador (Playwright)
    runs-on: ubuntu-latest
    needs: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Restaurar
        working-directory: front
        run: npm ci

      - name: Subir o simulador com o back-office
        run: docker compose up --build -d

      - name: Esperar o simulador
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8081/saude/pronto && exit 0
            sleep 5
          done
          docker compose logs simulador
          exit 1

      - name: Navegador
        working-directory: front
        run: npx playwright install --with-deps chromium

      - name: Cenários do painel e da marca
        working-directory: front
        env:
          SIM_BACKOFFICE_URL: http://localhost:8081
        run: npx playwright test

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report

      - name: Derrubar o simulador
        if: always()
        run: docker compose down -v
