# Ambiente local completo (RNF11): docker compose up --build
# Marca do ambiente: hml por padrão. Para produção, deixe vazia:
#   Simulador__MarcaDoAmbiente= docker compose up --build
services:
  simulador:
    build: .
    ports:
      - "8080:8080"            # APIs Open Finance
      - "127.0.0.1:8081:8081"  # Administração: só na própria máquina (FR-025)
    environment:
      Simulador__Mongo__Conexao: mongodb://mongo:27017
      Simulador__Redis__Conexao: redis:6379
      Simulador__MarcaDoAmbiente: ${Simulador__MarcaDoAmbiente-hml}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector:0.115.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  mongo:
    image: mongo:8.0
    environment:
      # O MongoDB 8.0 recusa iniciar em kernel 6.19 ou mais novo com cache por CPU (SERVER-121912).
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - dados-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dados-mongo:
